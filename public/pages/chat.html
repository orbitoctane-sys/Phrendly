<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Phrendly</title>
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="chat-container">
        <!-- Left Sidebar -->
        <div class="chat-sidebar">
            <!-- Search Users -->
            <div class="search-section">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search users..." 
                    class="search-box"
                >
                <buttonid="searchBtn" class="search-btn">
                    <i class="fas fa-search"></i>
                </button>
            </div>

            <!-- Search Results -->
            <div id="searchResults" class="search-results hidden">
                <h3>Search Results</h3>
                <div id="resultsList" class="results-list"></div>
            </div>

            <!-- Friend Requests Section -->
            <div class="requests-section">
                <h3>
                    <i class="fas fa-envelope"></i>
                    Friend Requests
                    <span id="requestCount" class="badge">0</span>
                </h3>
                <div id="requestsList" class="requests-list">
                    <p class="empty-message">No pending requests</p>
                </div>
            </div>

            <!-- Friends List -->
            <div class="friends-section">
                <h3>
                    <i class="fas fa-users"></i>
                    Friends
                    <span id="friendCount" class="badge">0</span>
                </h3>
                <div id="friendsList" class="friends-list">
                    <p class="empty-message">No friends yet</p>
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-main">
            <div id="noChatSelected" class="no-chat-selected">
                <div class="placeholder">
                    <i class="fas fa-comments"></i>
                    <h2>No Chat Selected</h2>
                    <p>Search for users, accept friend requests, or select a friend to start chatting</p>
                </div>
            </div>

            <div id="chatArea" class="chat-area hidden">
                <!-- Chat Header -->
                <div class="chat-header">
                    <div class="chat-header-info">
                        <h2 id="chatName"></h2>
                        <p id="chatStatus" class="chat-status">Online</p>
                    </div>
                    <buttonid="closeChat" class="close-btn">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <!-- Messages -->
                <div id="messagesContainer" class="messages-container">
                    <!-- Messages will be added here -->
                </div>

                <!-- Message Input -->
                <div class="message-input-area">
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="Type a message..." 
                        class="message-input"
                    >
                    <buttonid="sendBtn" class="send-btn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/chat.js"></script>
</body>
</html>
