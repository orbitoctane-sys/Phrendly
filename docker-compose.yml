version: '3.8'

services:
  app:
    build: .
    container_name: phrendly-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=your_jwt_secret_here
    volumes:
      - ./database:/app/database
    restart: unless-stopped
    networks:
      - phrendly-network

networks:
  phrendly-network:
    driver: bridge
