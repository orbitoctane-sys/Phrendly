<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Forgot Password
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <section class="register-page">

        <div class="register-right">

            <form class="register-form">

                <h2>
                    Reset Password
                </h2>

                <!-- EMAIL -->

                <input
                    type="email"
                    id="resetEmail"
                    placeholder="Enter Your Email"
                    required
                >

                <!-- NEW PASSWORD -->

                <input
                    type="password"
                    id="newPassword"
                    placeholder="New Password"
                    required
                >

                <!-- CONFIRM PASSWORD -->

                <input
                    type="password"
                    id="confirmNewPassword"
                    placeholder="Confirm New Password"
                    required
                >

                <!-- BUTTON -->

                <button
                    type="button"
                    id="resetBtn">

                    Reset Password

                </button>

                <!-- BACK TO LOGIN -->

                <p class="login-text">

                    Remember your password?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </form>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
